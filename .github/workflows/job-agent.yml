name: Job Application Agent

on:
  schedule:
    # 13:00 UTC daily. That's 6am Pacific during PDT, ~5am during PST - GitHub Actions cron
    # has no timezone/DST awareness, and this drift is an accepted tradeoff for this pass.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: job-agent
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run job-agent
        run: npm run job-agent

      - name: Commit and push ledger updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/job-agent-seen.json
          if git diff --cached --quiet; then
            echo "job-agent: no ledger changes to commit"
          else
            git commit -m "job-agent: daily scan update"
            git push
          fi
