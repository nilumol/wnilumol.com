<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
        </marker>
        <marker id="arrow-dashed" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
        </marker>
    </defs>
    
    <!-- Background -->
    <rect width="100%" height="100%" fill="#ffffff" />
    
    <!-- Styles -->
    <style>
        .box { fill: #ffffff; stroke: #333333; stroke-width: 2px; rx: 4px; }
        .boundary { fill: #fbfbfb; stroke: #666666; stroke-width: 2px; stroke-dasharray: 6,4; rx: 8px; }
        .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #111111; text-anchor: middle; }
        .text-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #666666; text-anchor: middle; }
        .line { stroke: #333333; stroke-width: 2px; fill: none; marker-end: url(#arrow); }
        .line-dashed { stroke: #666666; stroke-width: 2px; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrow-dashed); }
    </style>

    <!-- Title -->
    <text x="450" y="40" class="text-title" style="font-size: 22px;">Enterprise AI: Regulated Information Flow</text>

    <!-- Controlled Boundary -->
    <rect x="270" y="80" width="300" height="370" class="boundary" />
    <text x="420" y="110" class="text-title">Controlled Application Boundary</text>
    <text x="420" y="125" class="text-sub">Identity, Permissions, Auditability</text>

    <!-- Inputs -->
    <rect x="50" y="160" width="160" height="60" class="box" />
    <text x="130" y="190" class="text-title">System of Record</text>
    <text x="130" y="205" class="text-sub">Source Evidence (e.g., ELN)</text>

    <rect x="50" y="260" width="160" height="60" class="box" />
    <text x="130" y="290" class="text-title">Context &amp; Guardrails</text>
    <text x="130" y="305" class="text-sub">Templates, Regulatory Rules</text>

    <!-- Inside Boundary -->
    <rect x="300" y="160" width="240" height="40" class="box" />
    <text x="420" y="185" class="text-title">1. Source Extraction</text>

    <rect x="300" y="220" width="240" height="40" class="box" />
    <text x="420" y="245" class="text-title">2. Business Logic &amp; Rules</text>

    <rect x="300" y="280" width="240" height="40" class="box" />
    <text x="420" y="305" class="text-title">3. LLM Orchestration</text>

    <rect x="300" y="360" width="240" height="60" class="box" />
    <text x="420" y="385" class="text-title">4. Accountability Layer</text>
    <text x="420" y="400" class="text-sub">Human Review &amp; Decision</text>

    <!-- External/Outputs -->
    <rect x="650" y="280" width="160" height="40" class="box" />
    <text x="730" y="305" class="text-title">AI Platform (LLM)</text>

    <rect x="650" y="360" width="160" height="60" class="box" />
    <text x="730" y="390" class="text-title">Validated Output</text>
    <text x="730" y="405" class="text-sub">Evidence-Linked Artifacts</text>

    <!-- Connections (Arrows) -->
    <!-- Inputs to Boundary -->
    <path d="M 210 190 L 290 190" class="line" />
    <path d="M 210 290 L 250 290 L 250 240 L 290 240" class="line" />

    <!-- Internal Flow -->
    <path d="M 420 200 L 420 212" class="line" />
    <path d="M 420 260 L 420 272" class="line" />
    <path d="M 420 320 L 420 352" class="line" />

    <!-- AI Platform Interaction -->
    <path d="M 540 295 L 640 295" class="line" />
    <path d="M 640 305 L 540 305" class="line-dashed" />

    <!-- Final Output -->
    <path d="M 540 390 L 640 390" class="line" />
</svg>
