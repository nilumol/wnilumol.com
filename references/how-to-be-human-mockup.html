<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>How to Be Human — Page Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap" rel="stylesheet">
  <style>
    :root { --text: #191919; --line: rgba(25, 25, 25, 0.16); --page-x: clamp(24px, 5vw, 76px); --page-y: clamp(24px, 3.5vw, 52px); --content-width: 1180px; }
    * { box-sizing: border-box; }
    html { color: var(--text); background: #fff; }
    body { margin: 0; min-height: 100vh; color: var(--text); background: #fff; font-family: "DM Sans", sans-serif; }
    .site-header { width: min(100%, var(--content-width)); margin: 0 auto; padding: var(--page-y) var(--page-x) 0; display: flex; align-items: center; justify-content: space-between; gap: 32px; }
    .site-logo { display: inline-flex; align-items: center; }
    .site-logo-mark { width: 2.73rem; height: 2.73rem; display: block; }
    .site-nav { display: flex; gap: clamp(20px, 3vw, 42px); font-size: 0.92rem; }
    .nav-link { color: inherit; text-decoration: none; padding-bottom: 7px; }
    .hth-page { width: min(100%, 900px); margin: 0 auto; padding: clamp(56px, 7vw, 104px) var(--page-x) 110px; }
    h1 { margin: 0 0 18px; font-size: clamp(2.6rem, 6vw, 4.6rem); font-weight: 400; letter-spacing: -0.025em; line-height: 1.04; }
    .lede { max-width: 620px; margin: 0 0 56px; font-size: clamp(1.02rem, 1.4vw, 1.15rem); line-height: 1.65; }
    section { padding-top: 26px; border-top: 1px solid var(--line); }
    h2 { margin: 0; font-size: 1.3rem; font-weight: 400; letter-spacing: -0.01em; }
    @media (max-width: 780px) { .site-header { padding-top: 24px; } .site-nav { gap: 18px; font-size: 0.82rem; } }
    @media (max-width: 480px) { .site-nav { gap: 13px; font-size: 0.76rem; } }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="site-logo" href="/" aria-label="WN home">
      <svg class="site-logo-mark" viewBox="0 0 100 100" role="img" aria-hidden="true">
        <circle cx="50" cy="50" r="44" fill="none" stroke="var(--text)" stroke-width="2.5" />
        <text x="50" y="64" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', serif" font-size="30" font-weight="700" fill="var(--text)" letter-spacing="-2">WN</text>
      </svg>
    </a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a class="nav-link" href="/projects">Projects</a>
      <a class="nav-link" href="/career">Career</a>
      <a class="nav-link" href="/about">About</a>
    </nav>
  </header>
  <main class="hth-page">
    <h1>How to Be Human</h1>
    <p class="lede">A vlog that captures every aspect of my life</p>
    <section aria-labelledby="catalog-title">
      <h2 id="catalog-title">Catalog</h2>
    </section>
  </main>
</body>
</html>
